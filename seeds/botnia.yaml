# Botnia Skincare — tenant config, built from botnia-aeo-prompts-import.csv
# (30 prompts: six topics, each with three category prompts, one competitive
# and one branded).
#
# Import is REPLACE-semantics: loading this swaps Botnia's brand, competitors,
# personas, questions and brand facts wholesale. Past answers are kept (they
# are stored by question text). Engines are not listed, so Botnia's engine
# settings stay as they are.
#
# How the CSV maps here:
#   Topic     -> corpus (shows as the topic name on Scorecard > By topic)
#   Type      -> Category and Competitive prompts count toward the visibility
#                numbers, EXCEPT the four competitive prompts that name Botnia:
#                those are branded (a question that names the brand gets the
#                brand in the answer by design, so it would inflate the
#                mention rate). They are measured with the branded questions.
#   Persona   -> each prompt runs once plain (the baseline) and once as its
#                persona
#   Region    -> geo: us
#   Priority, Notes -> comments on each prompt (no field for them)

geo:
  country: us
  language: en

brand:
  name: Botnia Skincare
  aliases:
    - Botnia
  domains:
    - botniaskincare.com

competitors:
  # Named in the CSV. Tata Harper, True Botanicals and Eminence are marked
  # "rival assumed; review at day 14".
  - { name: Tata Harper, aliases: [Tata Harper Skincare], domains: [tataharperskincare.com] }
  - { name: True Botanicals, aliases: [], domains: [truebotanicals.com] }
  - { name: Eminence Organics, aliases: [Eminence, Eminence Organic Skin Care], domains: [eminenceorganics.com] }
  - { name: CeraVe, aliases: [], domains: [cerave.com] }
  - { name: La Roche-Posay, aliases: [La Roche Posay], domains: [laroche-posay.us] }
  # Other clean / botanical brands likely to appear in these answers. Check
  # against "What are some skincare brands like Botnia?" after the first runs.
  - { name: OSEA, aliases: [OSEA Malibu], domains: [oseamalibu.com] }
  - { name: Dr. Hauschka, aliases: [Dr Hauschka], domains: [drhauschka.com] }
  - { name: May Lindstrom, aliases: [May Lindstrom Skin], domains: [maylindstrom.com] }
  - { name: Avène, aliases: [Avene, Eau Thermale Avène], domains: [aveneusa.com] }

personas:
  # Generic baseline: every prompt runs once with no persona. Its presence
  # turns on selective mode, so each persona runs only on the prompts that
  # name it. Don't reword a persona once it's live: it breaks the trend line.
  - name: Generic (baseline)
    segment: generic
    prompt: ""
  - name: Reactive skin
    segment: reactive_skin
    prompt: >-
      My skin gets red and irritated from most products, and I think I might
      have mild rosacea.
  - name: Retinol alternative
    segment: retinol_alternative
    prompt: >-
      I'm in my late thirties and want to treat fine lines and dark spots, but
      I'd rather not use retinol.
  - name: Routine seeker
    segment: routine_seeker
    prompt: >-
      I want a simple skincare routine built on clean, natural products, and
      I'm not sure where to start.
  - name: Esthetician
    segment: esthetician
    prompt: >-
      I'm a licensed esthetician with a small solo studio, choosing a
      professional skincare line to use in facials and sell to my clients.

queries:
  # ---------------------------------------------------------------------
  # Sensitive and reactive skin
  - text: "What's a gentle plant-based skincare routine for skin that gets red and irritated from most products?"
    corpus: sensitive_and_reactive_skin
    personas: [reactive_skin]          # High
  - text: "Are there natural skincare brands that actually work for rosacea-prone skin?"
    corpus: sensitive_and_reactive_skin
    personas: [reactive_skin]          # High
  - text: "What's the best gentle face cleanser for sensitive skin that also removes makeup?"
    corpus: sensitive_and_reactive_skin
    personas: [reactive_skin]          # Medium. Gentle Cleanser hero claim
  - text: "What are good alternatives to Tata Harper for sensitive skin that cost less?"
    corpus: sensitive_and_reactive_skin
    personas: [reactive_skin]          # Medium, competitive. Rival assumed; review at day 14
  - text: "Is Botnia skincare good for sensitive skin?"
    corpus: sensitive_and_reactive_skin
    branded: true
    personas: [reactive_skin]          # High. Accuracy and sentiment check

  # ---------------------------------------------------------------------
  # Retinol alternatives
  - text: "What's a natural alternative to retinol that actually works for fine lines and dark spots?"
    corpus: retinol_alternatives
    personas: [retinol_alternative]    # High. Well Serum entry point
  - text: "What skincare is safe to use instead of retinol during pregnancy?"
    corpus: retinol_alternatives
    personas: [retinol_alternative]    # High. CLAIM RISK: any Botnia content aimed here needs review first
  - text: "Which works better for hyperpigmentation, bakuchiol or algae-based retinol alternatives?"
    corpus: retinol_alternatives
    personas: [retinol_alternative]    # Medium. Ingredient-led
  - text: "How does Botnia Well Serum compare to other retinol alternative serums?"
    corpus: retinol_alternatives
    branded: true                      # CSV: Competitive; names Botnia
    personas: [retinol_alternative]    # Medium
  - text: "Does Botnia Well Serum work like retinol?"
    corpus: retinol_alternatives
    branded: true
    personas: [retinol_alternative]    # High. Accuracy check on the hero product

  # ---------------------------------------------------------------------
  # Clean skincare routines
  - text: "Can you build me a simple clean skincare routine for combination skin with occasional breakouts?"
    corpus: clean_skincare_routines
    personas: [routine_seeker]         # High. The quiz's job
  - text: "What's a good clean skincare routine for someone in their late 30s starting to see fine lines?"
    corpus: clean_skincare_routines
    personas: [routine_seeker]         # Medium
  - text: "Where can I get a personalized skincare routine from an esthetician online?"
    corpus: clean_skincare_routines
    personas: [routine_seeker]         # High. The $15 consult's job
  - text: "Which is better for an all-natural routine, Botnia or True Botanicals?"
    corpus: clean_skincare_routines
    branded: true                      # CSV: Competitive; names Botnia
    personas: [routine_seeker]         # Medium. Rival assumed; review at day 14
  - text: "What Botnia products should I start with for combination skin?"
    corpus: clean_skincare_routines
    branded: true
    personas: [routine_seeker]         # Medium. Checks whether engines route to the quiz

  # ---------------------------------------------------------------------
  # Small-batch and independent skincare
  - text: "Which skincare brands make their products in small batches so they're fresh?"
    corpus: small_batch_and_independent_skincare
    personas: [routine_seeker]         # High. Botnia's clearest differentiator
  - text: "What are the best independent clean skincare brands that aren't owned by big beauty companies?"
    corpus: small_batch_and_independent_skincare
    personas: [routine_seeker]         # High
  - text: "Which organic skincare brands grow their own ingredients?"
    corpus: small_batch_and_independent_skincare
    personas: [routine_seeker]         # Medium. Farm-to-face story
  - text: "What are some skincare brands like Botnia?"
    corpus: small_batch_and_independent_skincare
    branded: true                      # CSV: Competitive; names Botnia
    personas: [routine_seeker]         # High. Reveals the peer set. Read first.
  - text: "Is Botnia skincare really made in small batches, and who makes it?"
    corpus: small_batch_and_independent_skincare
    branded: true
    personas: [routine_seeker]         # Medium. Founder and Sausalito lab accuracy

  # ---------------------------------------------------------------------
  # Skin barrier repair
  - text: "What plant-based products will help repair a skin barrier damaged from overusing exfoliants?"
    corpus: skin_barrier_repair
    personas: [reactive_skin]          # High
  - text: "What's the best moisturizer for a damaged skin barrier without synthetic fragrance?"
    corpus: skin_barrier_repair
    personas: [reactive_skin]          # High
  - text: "How long does it take to repair a damaged skin barrier, and what routine should I follow?"
    corpus: skin_barrier_repair
    personas: [reactive_skin]          # Medium
  - text: "What are natural alternatives to CeraVe or La Roche-Posay for skin barrier repair?"
    corpus: skin_barrier_repair
    personas: [reactive_skin]          # Medium, competitive. Mass-market defaults are the real rivals in barrier answers
  - text: "Is Botnia good for repairing a damaged skin barrier?"
    corpus: skin_barrier_repair
    branded: true
    personas: [reactive_skin]          # High. Founder teaches barrier masterclasses; check engines know it

  # ---------------------------------------------------------------------
  # Professional lines for estheticians
  - text: "What are the best organic professional skincare lines for estheticians offering holistic facials?"
    corpus: professional_lines_for_estheticians
    personas: [esthetician]            # High. Wholesale pipeline
  - text: "Which natural skincare brands have good wholesale terms for small spas and solo estheticians?"
    corpus: professional_lines_for_estheticians
    personas: [esthetician]            # High
  - text: "Which professional skincare brands train estheticians in botanical or herbal skincare?"
    corpus: professional_lines_for_estheticians
    personas: [esthetician]            # Medium. Training is a stated differentiator
  - text: "How does Botnia compare to Eminence Organics as a professional line for estheticians?"
    corpus: professional_lines_for_estheticians
    branded: true                      # CSV: Competitive; names Botnia
    personas: [esthetician]            # High. Rival assumed; review at day 14
  - text: "How do estheticians become Botnia partners, and what are the minimums?"
    corpus: professional_lines_for_estheticians
    branded: true
    personas: [esthetician]            # High. Wholesale facts accuracy

# Brand facts: EverPresent flags any answer that contradicts these. The CSV's
# accuracy checks (hero product, founder and Sausalito lab, wholesale terms)
# need Botnia's confirmed answers first. Fill in, then uncomment. A wrong fact
# here makes correct answers look wrong.
#
# brand_facts:
#   - label: "Botnia is handmade in small batches in its own lab in Sausalito, California"
#     subject: "where Botnia is made"
#     kind: disallowed          # `expected` is a phrase that must never appear
#     expected: "made in China"
#     category: origin
#   - label: "Partner (wholesale) minimum opening order is $[confirm]"
#     subject: "partner minimum order"
#     kind: numeric             # `expected` is the correct number; a different one is flagged
#     expected: "$[confirm]"
#     category: wholesale
