[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everpresent"
version = "3.0.0"
description = "EverPresent v3 — Generative Engine Optimization SaaS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "rq>=1.16",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
    "structlog>=24.1",
    "alembic>=1.13",
    "PyYAML>=6.0",
    "croniter>=2.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# Only the Playwright worker container installs [scrape]; the adapter imports
# playwright lazily so every other environment stays browser-free.
scrape = [
    "playwright>=1.45",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
    # For type-checking the scrape adapter; browsers are never installed in
    # dev/CI (fixture-only tests, §11.5).
    "playwright>=1.45",
]

[tool.setuptools]
packages = ["api", "api.routes", "engine", "engine.llm", "worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]  # generated by alembic autogenerate

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["api", "engine", "worker", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
